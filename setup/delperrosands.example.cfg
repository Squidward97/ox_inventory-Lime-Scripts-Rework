# Example: the DPS Inventory settings DelPerroSands runs with. Copy what you want into ox.cfg.

# Default look. Each player can still pick another from the gear button.
setr inventory:uistyle "delperro"
setr inventory:uisound 0.5

# Equipment slots for DelPerroSands. They sit after the 50 pocket slots, so saved inventories do not move.
setr inventory:utilityslots [ { "role": "backpack", "label": "Backpack", "items": ["backpack", "backpack2"] }, { "role": "phone", "label": "Phone", "items": ["phone", "iphone", "samsungphone", "black_phone", "green_phone", "red_phone", "white_phone", "yellow_phone", "mzphone", "oldphone"] }, { "role": "utility", "label": "ID and keys", "items": ["id_card", "driver_license", "weaponlicense", "wallet", "carkeys", "vehiclekeys", "housekeys"] }, { "role": "radio", "label": "Radio", "items": ["radio", "police_radio"] }, { "role": "armour", "label": "Vest", "items": ["armour"] }, { "role": "utility", "label": "Utility", "weapons": false }, { "role": "hotkey", "label": "Hotkey 1", "hotkey": 1 }, { "role": "hotkey", "label": "Hotkey 2", "hotkey": 2 }, { "role": "hotkey", "label": "Hotkey 3", "hotkey": 3 }, { "role": "hotkey", "label": "Hotkey 4", "hotkey": 4 }, { "role": "hotkey", "label": "Hotkey 5", "hotkey": 5 } ]

# A worn bag's contents count 60% toward carried weight. 30% when the bag sits in a stash or trunk.
setr inventory:backpackcarryweight 60
setr inventory:backpackstorageweight 30

# dps-bags already shows the bag on the back, so the inventory does not also change clothing.
setr inventory:utilityclothing {}

# Armour plates: 50 armour each, two per vest.
setr inventory:armourplates { "item": "armour_plate", "armourPerPlate": 50, "maxPlates": 2, "actionTime": 1500 }
